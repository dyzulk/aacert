
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write
  discussions: write

jobs:
  generate-notes-and-package:
    name: Generate Release Notes & Build Tarball
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout Source Code & History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install release-note SDKs
        run: python3 -m pip install -r .github/scripts/requirements-release-notes.txt

      - name: Generate Release Notes
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VERSION: ${{ steps.resolve_tag.outputs.tag }}
          OUTPUT_PATH: release-notes.md
          PROMPT_TEMPLATE: .github/prompts/release-notes-prompt.md
        run: |
          PYTHONPATH=.github/scripts python3 -m generate_release_notes "${VERSION}" "${OUTPUT_PATH}"

      - name: Package Release Tarball (Respecting .gitattributes)
        run: |
          git archive --format=tar.gz --prefix=aacert/ -o aacert.tar.gz HEAD

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            release-notes.md
            aacert.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: generate-notes-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download Release Assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.generate-notes-and-package.outputs.release_tag }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" aacert.tar.gz --clobber
            gh release edit "${TAG}" \
              --title "aacert ${TAG}" \
              --notes-file release-notes.md \
              "${PRERELEASE_FLAG[@]}"
          else
            gh release create "${TAG}" \
              aacert.tar.gz \
              --title "aacert ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag \
              "${PRERELEASE_FLAG[@]}"
          fi

      - name: Create or Update Release Announcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.generate-notes-and-package.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"
          TITLE="aacert ${TAG}"

          REPOSITORY_DATA=$(gh api graphql \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id discussionCategories(first: 50) { nodes { id name } } } }' \
            -F owner="${OWNER}" \
            -F name="${REPO}")

          REPOSITORY_ID=$(printf '%s' "${REPOSITORY_DATA}" | jq -r '.data.repository.id')
          CATEGORY_ID=$(printf '%s' "${REPOSITORY_DATA}" | jq -r '.data.repository.discussionCategories.nodes[] | select(.name == "Announcements") | .id')

          if [ -z "${REPOSITORY_ID}" ] || [ -z "${CATEGORY_ID}" ]; then
            echo "Could not find the repository or its Announcements discussion category." >&2
            exit 1
          fi

          DISCUSSIONS=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $categoryId: ID!) { repository(owner: $owner, name: $name) { discussions(first: 100, categoryId: $categoryId) { nodes { id title } } } }' \
            -F owner="${OWNER}" \
            -F name="${REPO}" \
            -F categoryId="${CATEGORY_ID}")

          DISCUSSION_ID=$(printf '%s' "${DISCUSSIONS}" | jq -r --arg title "${TITLE}" '.data.repository.discussions.nodes[] | select(.title == $title) | .id' | head -n 1)

          if [ -n "${DISCUSSION_ID}" ]; then
            gh api graphql \
              -f query='mutation($discussionId: ID!, $title: String!, $body: String!) { updateDiscussion(input: {discussionId: $discussionId, title: $title, body: $body}) { discussion { url } } }' \
              -F discussionId="${DISCUSSION_ID}" \
              -F title="${TITLE}" \
              -F body=@release-notes.md \
              --jq '.data.updateDiscussion.discussion.url'
          else
            gh api graphql \
              -f query='mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) { createDiscussion(input: {repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body}) { discussion { url } } }' \
              -F repositoryId="${REPOSITORY_ID}" \
              -F categoryId="${CATEGORY_ID}" \
              -F title="${TITLE}" \
              -F body=@release-notes.md \
              --jq '.data.createDiscussion.discussion.url'
          fi

      - name: Purge jsDelivr CDN Cache
        continue-on-error: true
        env:
          TAG: ${{ needs.generate-notes-and-package.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/purge_jsdelivr_cache.py
