name: Test Release Notes

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider scenario to run
        type: choice
        required: true
        default: all
        options:
          - all
          - gemini
          - groq
          - none
      version:
        description: Version or Git ref used to collect commit messages
        type: string
        required: true
        default: HEAD

permissions:
  contents: read

jobs:
  test-release-notes:
    name: Generate test outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install release-note SDKs
        run: python -m pip install -r .github/scripts/requirements-release-notes.txt

      - name: Generate selected release-note outputs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          VERSION: ${{ inputs.version }}
        run: |
          PYTHONPATH=.github/scripts python .github/scripts/test_release_notes.py \
            --provider "$PROVIDER" \
            --env-file /dev/null \
            --output-dir artifacts/release-notes \
            --version "$VERSION"

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-test-${{ github.run_number }}
          path: artifacts/release-notes/*.md
          if-no-files-found: warn
          retention-days: 7
